<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#12294F"><title>Kolekto</title>
<style>
:root{--navy:#12294F;--pink:#FF2E93;--vio:#6200EE;--bg:#F6F7FB;--card:#fff;--ink:#12294F;--mut:#8A93A6;--line:#E3E6EE;--ok:#7BDB6B;--no:#FF3B30}
@media(prefers-color-scheme:dark){:root{--bg:#0C1428;--card:#16223F;--ink:#EEF1F8;--mut:#98A3BC;--line:#26355B}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0}
html,body{height:100%}body{background:var(--bg);color:var(--ink);font:16px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-top:env(safe-area-inset-top);overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
#app{max-width:560px;margin:0 auto;padding:16px 16px 110px;min-height:100%}
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.top img{height:44px}.top h1{font-size:22px;font-weight:600;flex:1}
.back{border:0;background:none;padding:6px;display:flex}
h2{font-size:15px;font-weight:700;margin:6px 0 10px}
.bar{height:16px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pink);border-radius:99px;transition:width .5s}
.chips{display:flex;gap:8px;overflow-x:auto;padding:16px 0;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{border:0;border-radius:99px;padding:11px 18px;background:var(--line);color:var(--mut);font-weight:600;white-space:nowrap}
.chip.on{background:var(--vio);color:#fff}
.card{background:var(--card);border-radius:24px;padding:18px 20px;margin-bottom:14px;box-shadow:0 6px 18px rgba(18,41,79,.1);cursor:pointer;display:block;width:100%;text-align:left;border:0}
.card:active{transform:scale(.98)}
.card b{font-size:18px;display:block;margin-bottom:8px}
.meta{display:flex;justify-content:space-between;font-size:14px;color:var(--mut);margin-bottom:8px}
.empty{text-align:center;padding:40px 20px;color:var(--mut)}.empty img{width:90px;opacity:.9;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tile{background:var(--card);border-radius:20px;padding:8px;text-align:center;box-shadow:0 4px 12px rgba(18,41,79,.08);position:relative;border:0;cursor:pointer}
.tile .pic{aspect-ratio:1;border-radius:14px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;color:var(--line);overflow:hidden}
.tile.has .pic{color:var(--navy);background:#EAF8E7}
.tile .pic img{width:100%;height:100%;object-fit:cover}
.tile .nm{font-size:11px;color:var(--mut);height:15px;overflow:hidden;margin-top:4px}
.pill{display:block;border-radius:99px;padding:3px 0;font-size:13px;font-weight:700;background:var(--no);color:#fff;margin-top:2px}
.has .pill{background:var(--ok);color:#12290F}
.rep{position:absolute;top:4px;right:4px;background:var(--vio);color:#fff;border-radius:99px;font-size:12px;font-weight:700;padding:2px 8px}
.nav{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom));display:flex;justify-content:center;pointer-events:none}
.nav div{pointer-events:auto;display:flex;gap:6px;background:var(--card);border-radius:99px;padding:8px;box-shadow:0 8px 26px rgba(18,41,79,.22)}
.nav button{border:0;background:none;border-radius:99px;width:68px;height:48px;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.nav button.on{background:var(--navy);color:#fff}
.fab{background:var(--pink)!important;color:#fff!important;width:84px!important}
svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sheet-bg{position:fixed;inset:0;background:rgba(8,16,34,.55);display:none;align-items:flex-end;justify-content:center;z-index:20}
.sheet-bg.on{display:flex}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:28px 28px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom));animation:up .25s}
@keyframes up{from{transform:translateY(60px);opacity:0}}
label{display:block;font-size:13px;font-weight:600;color:var(--mut);margin:14px 0 6px}
input,select,textarea{width:100%;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:12px 14px;outline:0}
input:focus,select:focus,textarea:focus{border-color:var(--vio)}
.btn{border:0;border-radius:99px;padding:14px 22px;font-weight:700;background:var(--vio);color:#fff;width:100%;margin-top:16px;cursor:pointer}
.btn.alt{background:var(--card);color:var(--ink);border:2px solid var(--line)}.btn.del{background:none;color:var(--no);border:2px solid var(--no)}
.row{display:flex;gap:10px}.row>*{flex:1}
.photo{aspect-ratio:4/3;border-radius:18px;background:var(--card);border:2px dashed var(--line);display:flex;align-items:center;justify-content:center;color:var(--mut);overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover}
.step{display:flex;align-items:center;gap:14px;justify-content:center;margin-top:8px}
.step button{width:46px;height:46px;border-radius:50%;border:0;background:var(--navy);color:#fff;font-size:24px;font-weight:700}
.step span{font-size:28px;font-weight:800;min-width:50px;text-align:center}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 20px;border-radius:99px;z-index:40;font-size:14px;opacity:0;transition:.3s;pointer-events:none;max-width:90%;text-align:center}.toast.on{opacity:1}
#splash{position:fixed;inset:0;background:#fff;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:opacity .5s}
#splash img:first-child{height:120px;animation:pop .7s}#splash img+img{width:170px}
@keyframes pop{from{transform:scale(.6) rotate(-8deg);opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.sm{font-size:13px;color:var(--mut);margin-top:6px}
</style></head><body>

const CATS=['Stickers','Figuras','Cartas','Otros'];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const I={home:'<svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/></svg>',plus:'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',gear:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>',cam:'<svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',back:'<svg viewBox="0 0 24 24" style="stroke:var(--pink);width:34px;height:34px"><path d="M20 12H5M11 6l-6 6 6 6"/></svg>',edit:'<svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>'};
let S={name:'',cols:[],gid:''},R={v:'home',cat:'Todos',id:null,f:'Todas'},P=null,pend=null;
/* ---- almacenamiento (IndexedDB, con respaldo en localStorage) ---- */
const db=new Promise((ok,no)=>{const r=indexedDB.open('kolekto',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>ok(r.result);r.onerror=no});
const idbGet=async()=>{const d=await db;return new Promise(r=>{const q=d.transaction('kv').objectStore('kv').get('s');q.onsuccess=()=>r(q.result);q.onerror=()=>r()})};
const save=()=>db.then(d=>d.transaction('kv','readwrite').objectStore('kv').put(S,'s')).catch(()=>{try{localStorage.setItem('kolekto',JSON.stringify(S))}catch(e){toast('No hay espacio para guardar')}});
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2600)}
const col=id=>S.cols.find(c=>c.id===id);
const owned=c=>Object.entries(c.items).filter(([n,i])=>i.q>0&&n<=c.total).length;
const pct=(a,b)=>b?Math.round(a/b*100):0;
/* ---- pantallas ---- */
function render(){
 const a=$('#app'),n=$('#nav');
 n.innerHTML=`<button class="${R.v=='home'?'on':''}" onclick="go('home')" aria-label="Inicio">${I.home}</button><button class="fab" onclick="colSheet()" aria-label="Nueva colección">${I.plus}</button><button class="${R.v=='set'?'on':''}" onclick="go('set')" aria-label="Ajustes">${I.gear}</button>`;
 if(R.v=='home'){
  const T=S.cols.reduce((s,c)=>s+c.total,0),O=S.cols.reduce((s,c)=>s+owned(c),0);
  const list=S.cols.filter(c=>R.cat=='Todos'||c.cat==R.cat);
  a.innerHTML=`<div class="top"><img src="${ICON}" alt=""><h1>Hola, ${esc(S.name||'coleccionista')}</h1></div>
  <h2>Tu progreso actual</h2><div class="bar"><i style="width:${pct(O,T)}%"></i></div><div class="sm">${O} de ${T} piezas · ${pct(O,T)}%</div>
  <div class="chips">${['Todos',...CATS].map(c=>`<button class="chip ${R.cat==c?'on':''}" onclick="R.cat='${c}';render()">${c}</button>`).join('')}</div>
  ${list.length?list.map(c=>{const o=owned(c);return `<button class="card" onclick="go('col','${c.id}')"><b>${esc(c.name)}</b><div class="meta"><span>${o}/${c.total} piezas</span><span>${pct(o,c.total)}%</span></div><div class="bar"><i style="width:${pct(o,c.total)}%"></i></div></button>`}).join(''):`<div class="empty"><img src="${ICON}" alt=""><p><b>${S.cols.length?'Nada en esta categoría':'Aún no tienes colecciones'}</b></p><p>Toca el botón rosa para crear la primera.</p></div>`}`;
 }else if(R.v=='col'){
  const c=col(R.id);if(!c)return go('home');
  const o=owned(c),f=R.f;let h='';
  for(let i=1;i<=c.total;i++){const it=c.items[i]||{q:0},has=it.q>0;
   if(f=='Tengo'&&!has||f=='Faltan'&&has||f=='Repetidas'&&it.q<2)continue;
   h+=`<button class="tile ${has?'has':''}" onclick="pieceSheet('${c.id}',${i})">${it.q>1?`<span class="rep">x${it.q}</span>`:''}<div class="pic">${it.photo?`<img src="${it.photo}" alt="">`:i}</div><div class="nm">${esc(it.name||'')}</div><span class="pill">${has?'Tengo':'Falta'}</span></button>`}
  a.innerHTML=`<div class="top"><button class="back" onclick="go('home')" aria-label="Volver">${I.back}</button><h1>${esc(c.name)}</h1><button class="back" onclick="colSheet('${c.id}')" aria-label="Editar">${I.edit}</button></div>
  <div class="bar"><i style="width:${pct(o,c.total)}%"></i></div><div class="sm">${o}/${c.total} piezas · ${pct(o,c.total)}%</div>
  <div class="chips">${['Todas','Tengo','Faltan','Repetidas'].map(x=>`<button class="chip ${f==x?'on':''}" onclick="R.f='${x}';render()">${x}</button>`).join('')}</div>
  <div class="grid">${h||'<p class="empty" style="grid-column:1/4">No hay piezas en este filtro.</p>'}</div>`;
  n.innerHTML=`<button onclick="go('home')" aria-label="Inicio">${I.home}</button><button class="fab" onclick="$('#cam').click()" aria-label="Tomar foto">${I.cam}</button><button onclick="go('set')" aria-label="Ajustes">${I.gear}</button>`;
 }else{
  a.innerHTML=`<div class="top"><img src="${LOGO}" alt="Kolekto" style="height:28px"><h1></h1></div><h2>Ajustes</h2>
  <label>Tu nombre</label><input value="${esc(S.name)}" onchange="S.name=this.value.trim();save();toast('Nombre guardado')" placeholder="¿Cómo te llamamos?">
  <h2 style="margin-top:26px">Tus datos</h2><p class="sm">Todo se guarda en este dispositivo, fotos incluidas.</p>
  <div class="row"><button class="btn alt" onclick="exp('json')">Exportar copia</button><button class="btn alt" onclick="exp('csv')">Exportar CSV</button></div>
  <div class="row"><button class="btn alt" onclick="$('#imp').click()">Importar copia</button><button class="btn alt" onclick="copyData()">Copiar datos</button></div>
  <h2 style="margin-top:26px">Google Drive (opcional)</h2><p class="sm">Guarda tu progreso en tu cuenta de Google. Necesita un Client ID de Google Cloud (OAuth, tipo web).</p>
  <input value="${esc(S.gid)}" onchange="S.gid=this.value.trim();save()" placeholder="Client ID de Google">
  <div class="row"><button class="btn" onclick="drive('up')">Guardar en Drive</button><button class="btn alt" onclick="drive('down')">Restaurar</button></div>
  <button class="btn del" style="margin-top:30px" onclick="if(confirm('¿Borrar TODAS tus colecciones y fotos?')){S.cols=[];save();go('home')}">Borrar todo</button>`;
 }
}
function go(v,id){R={...R,v,id:id||R.id,f:'Todas'};scrollTo(0,0);if(v!='home')history.pushState(0,'');render()}
addEventListener('popstate',()=>{if($('#sbg').classList.contains('on'))return closeS();R.v='home';render()});
/* ---- hojas ---- */
const openS=h=>{$('#sheet').innerHTML=h;$('#sbg').classList.add('on')};
const closeS=()=>{$('#sbg').classList.remove('on');P=null;pend=null};
$('#sbg').onclick=e=>{if(e.target.id=='sbg')closeS()};
function colSheet(id){const c=id?col(id):{name:'',cat:'Stickers',total:100};
 openS(`<h2>${id?'Editar colección':'Nueva colección'}</h2><label>¿Qué coleccionas?</label><input id="cn" value="${esc(c.name)}" placeholder="Ej. Mundial 2026, monedas, Pokémon">
 <div class="row"><div><label>Categoría</label><select id="cc">${CATS.map(x=>`<option ${x==c.cat?'selected':''}>${x}</option>`).join('')}</select></div><div><label>Total de piezas</label><input id="ct" type="number" min="1" max="5000" value="${c.total}"></div></div>
 <button class="btn" onclick="colSave('${id||''}')">Guardar</button>${id?`<button class="btn del" onclick="colDel('${id}')">Eliminar colección</button>`:''}`)}
function colSave(id){const name=$('#cn').value.trim(),total=Math.max(1,Math.min(5000,+$('#ct').value||0));if(!name)return toast('Ponle un nombre a la colección');
 if(id){const c=col(id);Object.assign(c,{name,total,cat:$('#cc').value})}else{const c={id:'c'+Date.now(),name,total,cat:$('#cc').value,items:{}};S.cols.unshift(c);R.v='home'}
 save();closeS();render()}
function colDel(id){if(confirm('¿Eliminar esta colección y sus fotos?')){S.cols=S.cols.filter(c=>c.id!=id);save();closeS();go('home')}}
function pieceSheet(cid,n,photo){const c=col(cid),it=c.items[n]||{q:0,name:'',note:'',photo:''};
 P={cid,n,q:it.q,name:it.name||'',note:it.note||'',photo:photo||it.photo||''};if(photo&&!it.q)P.q=1;drawP()}
function drawP(){const c=col(P.cid);
 openS(`<h2>${esc(c.name)}</h2><div class="row"><div><label>Pieza n.º</label><input type="number" min="1" max="${c.total}" value="${P.n}" onchange="chN(this.value)"></div><div style="flex:2"><label>Nombre (opcional)</label><input value="${esc(P.name)}" oninput="P.name=this.value" placeholder="Ej. Messi"></div></div>
 <label>Foto</label><div class="photo">${P.photo?`<img src="${P.photo}" alt="">`:'Sin foto'}</div>
 <div class="row"><button class="btn alt" onclick="$('#cam').click()">Tomar foto</button><button class="btn alt" onclick="$('#gal').click()">Galería</button></div>${P.photo?'<button class="btn del" onclick="P.photo=\'\';drawP()">Quitar foto</button>':''}
 <label>Copias que tengo</label><div class="step"><button onclick="P.q=Math.max(0,P.q-1);drawP()">−</button><span>${P.q}</span><button onclick="P.q++;drawP()">+</button></div><p class="sm" style="text-align:center">${P.q?P.q>1?'Tienes '+(P.q-1)+' repetida(s)':'Marcada como Tengo':'Marcada como Falta'}</p>
 <label>Notas</label><textarea rows="2" oninput="P.note=this.value" placeholder="Estado, dónde la conseguiste…">${esc(P.note)}</textarea><button class="btn" onclick="pSave()">Guardar pieza</button>`)}
function chN(v){const c=col(P.cid),n=Math.max(1,Math.min(c.total,+v||1)),ph=P.photo,keep=pend;pieceSheet(P.cid,n);if(keep&&ph){P.photo=ph;if(!P.q)P.q=1;drawP()}}
function pSave(){const c=col(P.cid);c.items[P.n]={q:P.q,name:P.name.trim(),note:P.note.trim(),photo:P.photo};save();closeS();render();toast('Pieza '+P.n+' guardada')}
/* ---- fotos ---- */
function shrink(file){return new Promise(ok=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const m=520,k=Math.min(1,m/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=im.width*k;cv.height=im.height*k;cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);ok(cv.toDataURL('image/jpeg',.72))};im.src=r.result};r.readAsDataURL(file)})}
async function onPhoto(e){const f=e.target.files[0];e.target.value='';if(!f)return;const d=await shrink(f);
 if(P){P.photo=d;if(!P.q)P.q=1;drawP()}else if(R.v=='col'){const c=col(R.id);let n=1;while(n<c.total&&(c.items[n]||{}).q>0)n++;pend=1;pieceSheet(c.id,n,d)}}
$('#cam').onchange=onPhoto;$('#gal').onchange=onPhoto;
/* ---- exportar / importar / Google ---- */
function out(name,text,type){const f=new File([text],name,{type});
 if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:name}).catch(()=>{});return}
 const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=name;document.body.appendChild(a);a.click();a.remove();toast('Archivo exportado')}
function exp(t){const d=new Date().toISOString().slice(0,10);
 if(t=='json')return out('kolekto-'+d+'.json',JSON.stringify(S),'application/json');
 let s='\ufeffColeccion,Categoria,Pieza,Nombre,Copias,Notas\n';
 S.cols.forEach(c=>{for(let i=1;i<=c.total;i++){const x=c.items[i]||{q:0};s+=[c.name,c.cat,i,x.name||'',x.q,x.note||''].map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')+'\n'}});
 out('kolekto-'+d+'.csv',s,'text/csv')}
function copyData(){navigator.clipboard.writeText(JSON.stringify(S)).then(()=>toast('Datos copiados. Pégalos donde quieras guardarlos'),()=>toast('No se pudo copiar'))}
$('#imp').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{const d=JSON.parse(await f.text());if(!Array.isArray(d.cols))throw 0;if(!confirm('Esto reemplaza tus datos actuales. ¿Continuar?'))return;S={name:'',gid:S.gid,...d};save();toast('Copia importada');go('home')}catch(x){toast('El archivo no es una copia de Kolekto')}};
function drive(m){if(!S.gid)return toast('Pega primero tu Client ID de Google');
 const run=()=>google.accounts.oauth2.initTokenClient({client_id:S.gid,scope:'https://www.googleapis.com/auth/drive.appdata',callback:async r=>{if(!r.access_token)return toast('No se pudo conectar con Google');const h={Authorization:'Bearer '+r.access_token};
  try{const j=await(await fetch("https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=name%3D'kolekto.json'&fields=files(id)",{headers:h})).json(),id=j.files&&j.files[0]&&j.files[0].id;
  if(m=='up'){const b='kk',body=`--${b}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(id?{}:{name:'kolekto.json',parents:['appDataFolder']})}\r\n--${b}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(S)}\r\n--${b}--`;
   await fetch('https://www.googleapis.com/upload/drive/v3/files'+(id?'/'+id:'')+'?uploadType=multipart',{method:id?'PATCH':'POST',headers:{...h,'Content-Type':'multipart/related; boundary='+b},body});toast('Copia guardada en Google Drive')}
  else{if(!id)return toast('No hay copia en tu Drive todavía');const d=await(await fetch('https://www.googleapis.com/drive/v3/files/'+id+'?alt=media',{headers:h})).json();S={name:'',gid:S.gid,...d};save();toast('Progreso restaurado');go('home')}}
  catch(x){toast('Error al hablar con Google Drive')}}}).requestAccessToken();
 if(window.google&&google.accounts)run();else{const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.onload=run;s.onerror=()=>toast('Sin conexión a internet');document.head.appendChild(s)}}
/* ---- inicio ---- */
(async()=>{try{S={...S,...(await idbGet()||JSON.parse(localStorage.getItem('kolekto')||'{}'))}}catch(e){try{S={...S,...JSON.parse(localStorage.getItem('kolekto')||'{}')}}catch(x){}}
 render();setTimeout(()=>{const s=$('#splash');s.style.opacity=0;setTimeout(()=>s.remove(),500)},1100)})();
</script></body></html>
